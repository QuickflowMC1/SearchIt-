name: Update patches doc
permissions:
  contents: write
  pull-requests: write

on:
  push:
    branches:
      - 'master'
    paths:
      - 'build/**'

  workflow_dispatch:
    inputs:
      rtag:
        description: 'QuickflowMC1/SearchIt- TAG or COMMIT'
        required: true
        default: ''

env:
  RTAG: ${{ github.event.inputs.rtag }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: "Get value from dispatch"
        run: |
          if [ -z "${RTAG}" ]; then
            echo "RTAG=$GITHUB_SHA" >> $GITHUB_ENV
            echo "RTAG=$RTAG"
          fi

      - name: Checkout 'QuickflowMC1/SearchIt-' ${{ env.BRANCH }}
        uses: actions/checkout@v2
        with:
            repository: 'QuickflowMC1/SearchIt-'
            ref: ${{ env.RTAG }}
            path: 'SearchIt!'
            fetch-depth: 1

      - name: Generate patches doc
        run: |
          export HOME=$GITHUB_WORKSPACE

          bash ~/SearchIt!/tools/extract-all-patch-data.sh ~/SearchIt!/build/patches

      - name: Check differences CHANGES=${{ env.CHANGES }}
        run: |
          export HOME=$GITHUB_WORKSPACE

          cd ~/SearchIt!
          CHANGES=0 && git diff --quiet || CHANGES=1
          echo "CHANGES=$CHANGES" >> $GITHUB_ENV

          if [[ CHANGES -eq 1 ]]; then
              git add docs/*.md
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c #v6.1.0
        if: env.CHANGES == '1'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          path: SearchIt!
          base: ${{ env.BRANCH }}
          add-paths: |
            docs/*.md
          commit-message: '[AUTO][DOC] Generate patches doc for master branch'
          title: '[AUTO][DOC] Generate patches doc for master branch'
          body: ${{ env.MESSAGE }}
          delete-branch: true
          branch-suffix: short-commit-hash
